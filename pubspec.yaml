name: flutter_mmcalendar
description: "A comprehensive Flutter package for Myanmar calendar with date conversions, astrological calculations, and multi-language support"
version: 3.3.0
homepage: https://github.com/mixin27/flutter-mmcalendar
repository: https://github.com/mixin27/flutter-mmcalendar
issue_tracker: https://github.com/mixin27/flutter-mmcalendar/issues
funding:
  - https://www.buymeacoffee.com/kyawzayartun98

environment:
  sdk: ^3.11.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  myanmar_calendar_dart: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

topics:
  - calendar
  - myanmar-calendar
  - myanmar-datetime
  - utility
  - myanmar-calendar-view

screenshots:
  - description: Myanmar calendar widget demo.
    path: screenshots/calendar_widget.png
  - description: Myanmar date picker widget demo.
    path: screenshots/date_picker_widget.png
  - description: Other information demo.
    path: screenshots/others.png
